// ─── Business Day Calculator (exclude Sat & Sun) ─────────────────────────────
function businessDaysBetween(startStr, endStr) {
  const start = new Date(startStr);
  const end   = new Date(endStr);
  if (isNaN(start) || isNaN(end)) return null;
  let count = 0;
  const cur = new Date(start);
  // Move to next day (start date is day 0)
  cur.setDate(cur.getDate() + 1);
  while (cur <= end) {
    const dow = cur.getDay();
    if (dow !== 0 && dow !== 6) count++;
    cur.setDate(cur.getDate() + 1);
  }
  return count;
}

// ─── Process Data ─────────────────────────────────────────────────────────────
const TODAY = '2026-03-30';

function processData(data) {
  return data.map(row => {
    const endDate = row.finish || TODAY;
    const elapsed = businessDaysBetween(row.assign, endDate);
    const isCompleted = !!row.finish;
    return { ...row, elapsedDays: elapsed, completed: isCompleted, endDate };
  });
}

// ─── Filter ───────────────────────────────────────────────────────────────────
function filterData(data) {
  const cat    = document.getElementById('filterCat').value;
  const grp    = document.getElementById('filterGrp').value;
  const status = document.getElementById('filterStatus').value;
  return data.filter(r => {
    if (cat !== 'All' && r.category !== cat) return false;
    if (grp !== 'All' && r.group !== grp) return false;
    if (status === 'Completed' && !r.completed) return false;
    if (status === 'Open' && r.completed) return false;
    return true;
  });
}

// ─── Charts ───────────────────────────────────────────────────────────────────
let scatterChart = null;
let barChart     = null;

const COLORS = {
  'HUB-Investigation':      { bg: 'rgba(99,102,241,0.75)',  border: '#6366f1' },
  'HUB-Warranty':           { bg: 'rgba(59,130,246,0.75)',  border: '#3b82f6' },
  'Powertrain-Investigation':{ bg: 'rgba(249,115,22,0.75)', border: '#f97316' },
  'Powertrain-Warranty':    { bg: 'rgba(234,179,8,0.75)',   border: '#eab308' },
};

function getColor(group, category) {
  return COLORS[group + '-' + category] || { bg: 'rgba(148,163,184,0.7)', border: '#94a3b8' };
}

function renderStats(data) {
  const completed = data.filter(r => r.completed && r.elapsedDays !== null);
  const open      = data.filter(r => !r.completed);
  const avgAll    = completed.length ? (completed.reduce((s,r) => s + r.elapsedDays, 0) / completed.length) : 0;
  const maxD      = completed.length ? Math.max(...completed.map(r => r.elapsedDays)) : 0;
  const hubCount  = data.filter(r => r.group === 'HUB').length;
  const ptCount   = data.filter(r => r.group === 'Powertrain').length;

  document.getElementById('statsRow').innerHTML = `
    <div class="stat-card"><div class="label">Total Reports</div><div class="value">${data.length}</div><div class="sub">Filtered results</div></div>
    <div class="stat-card"><div class="label">Avg Elapsed (Completed)</div><div class="value" style="color:${avgAll<=15?'#059669':'#dc2626'}">${avgAll.toFixed(1)} <span style="font-size:14px;color:#94a3b8">days</span></div><div class="sub">Business days (excl. Sat/Sun)</div></div>
    <div class="stat-card"><div class="label">Max Elapsed</div><div class="value" style="color:#dc2626">${maxD} <span style="font-size:14px;color:#94a3b8">days</span></div><div class="sub">Longest turnaround</div></div>
    <div class="stat-card"><div class="label">Completed / Open</div><div class="value">${completed.length} / <span style="color:#dc2626">${open.length}</span></div><div class="sub">HUB: ${hubCount} | PT: ${ptCount}</div></div>
  `;
}

function renderScatter(data) {
  const ctx = document.getElementById('scatterChart').getContext('2d');
  if (scatterChart) scatterChart.destroy();

  // Group datasets by group+category
  const groups = {};
  data.forEach(r => {
    if (r.elapsedDays === null) return;
    const key = r.group + '-' + r.category;
    if (!groups[key]) groups[key] = [];
    groups[key].push({
      x: r.assign,
      y: r.elapsedDays,
      report: r.report,
      title: r.title,
      completed: r.completed,
    });
  });

  const datasets = Object.entries(groups).map(([key, points]) => {
    const c = getColor(key.split('-')[0], key.split('-')[1]);
    return {
      label: key,
      data: points,
      backgroundColor: points.map(p => p.completed ? c.bg : c.bg.replace('0.75', '0.3')),
      borderColor: points.map(p => p.completed ? c.border : c.border + '66'),
      borderWidth: 1.5,
      pointRadius: 6,
      pointHoverRadius: 9,
      pointStyle: points.map(p => p.completed ? 'circle' : 'rectRot'),
    };
  });

  scatterChart = new Chart(ctx, {
    type: 'scatter',
    data: { datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { usePointStyle: true, padding: 12, font: { size: 11 } } },
        tooltip: {
          callbacks: {
            label(ctx) {
              const p = ctx.raw;
              return [
                `${p.report} — ${p.completed ? 'Completed' : 'In Progress'}`,
                `Assign: ${p.x}`,
                `Elapsed: ${p.y} business days`,
                p.title ? p.title.substring(0, 60) : '',
              ].filter(Boolean);
            },
          },
        },
        annotation: {
          annotations: {
            targetLine: {
              type: 'line',
              yMin: 15,
              yMax: 15,
              borderColor: 'rgba(239, 68, 68, 0.8)',
              borderWidth: 2,
              borderDash: [6, 3],
              label: {
                display: true,
                content: 'Target ≤ 15 days',
                position: 'start',
                backgroundColor: 'rgba(239, 68, 68, 0.8)',
                color: '#fff',
                font: { size: 10, weight: 'bold' },
                padding: 4,
              },
            },
          },
        },
      },
      scales: {
        x: {
          type: 'category',
          labels: [...new Set(data.filter(r => r.elapsedDays !== null).map(r => r.assign))].sort(),
          title: { display: true, text: 'Assign (Issue) Date', font: { size: 12, weight: 'bold' } },
          ticks: { maxRotation: 45, font: { size: 10 } },
          grid: { display: false },
        },
        y: {
          beginAtZero: true,
          title: { display: true, text: 'Elapsed Business Days', font: { size: 12, weight: 'bold' } },
          ticks: { font: { size: 11 } },
          grid: { color: '#e2e8f0' },
        },
      },
    },
  });
}

function renderBarChart(data) {
  const ctx = document.getElementById('barChart').getContext('2d');
  if (barChart) barChart.destroy();

  // Aggregate completed data by month + group
  const completed = data.filter(r => r.completed && r.elapsedDays !== null);
  const monthMap = {};

  completed.forEach(r => {
    const monthKey = r.assign.substring(0, 7); // YYYY-MM
    if (!monthMap[monthKey]) monthMap[monthKey] = { HUB: [], Powertrain: [] };
    if (monthMap[monthKey][r.group]) monthMap[monthKey][r.group].push(r.elapsedDays);
  });

  const months = Object.keys(monthMap).sort();
  const hubAvgs = months.map(m => {
    const arr = monthMap[m].HUB;
    return arr.length ? +(arr.reduce((a,b) => a+b, 0) / arr.length).toFixed(1) : null;
  });
  const ptAvgs = months.map(m => {
    const arr = monthMap[m].Powertrain;
    return arr.length ? +(arr.reduce((a,b) => a+b, 0) / arr.length).toFixed(1) : null;
  });
  const monthLabels = months.map(m => {
    const [y, mo] = m.split('-');
    const names = ['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return names[parseInt(mo)] + ' ' + y.slice(2);
  });

  barChart = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: monthLabels,
      datasets: [
        { label: 'HUB', data: hubAvgs, backgroundColor: 'rgba(99,102,241,0.7)', borderColor: '#6366f1', borderWidth: 1, borderRadius: 4 },
        { label: 'Powertrain', data: ptAvgs, backgroundColor: 'rgba(249,115,22,0.7)', borderColor: '#f97316', borderWidth: 1, borderRadius: 4 },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: 'top', labels: { usePointStyle: true, padding: 12, font: { size: 11 } } },
        tooltip: { callbacks: { label: ctx => ctx.parsed.y !== null ? `${ctx.dataset.label}: ${ctx.parsed.y} days` : 'No data' } },
        annotation: {
          annotations: {
            targetLine: {
              type: 'line',
              yMin: 15,
              yMax: 15,
              borderColor: 'rgba(239, 68, 68, 0.8)',
              borderWidth: 2,
              borderDash: [6, 3],
              label: {
                display: true,
                content: 'Target ≤ 15 days',
                position: 'end',
                backgroundColor: 'rgba(239, 68, 68, 0.8)',
                color: '#fff',
                font: { size: 10, weight: 'bold' },
                padding: 4,
              },
            },
          },
        },
      },
      scales: {
        y: {
          beginAtZero: true,
          title: { display: true, text: 'Avg Elapsed Business Days', font: { size: 12, weight: 'bold' } },
          ticks: { font: { size: 11 } },
          grid: { color: '#e2e8f0' },
        },
        x: { ticks: { font: { size: 11 } }, grid: { display: false } },
      },
    },
  });
}

function renderTable(data) {
  const tbody = document.querySelector('#dataTable tbody');
  tbody.innerHTML = data.map(r => `
    <tr>
      <td><strong>${r.report}</strong></td>
      <td>${r.assign}</td>
      <td>${r.finish || '<span style="color:#94a3b8">—</span>'}</td>
      <td style="font-weight:700; color:${r.elapsedDays === null ? '#94a3b8' : r.elapsedDays <= 15 ? '#059669' : '#dc2626'}">
        ${r.elapsedDays !== null ? r.elapsedDays + ' days' : '—'}
        ${!r.completed && r.elapsedDays !== null ? ' <span style="font-size:9px;color:#94a3b8">(ongoing)</span>' : ''}
      </td>
      <td><span class="badge ${r.category === 'Investigation' ? 'badge-inv' : 'badge-war'}">${r.category}</span></td>
      <td><span class="badge ${r.group === 'HUB' ? 'badge-hub' : 'badge-pt'}">${r.group}</span></td>
      <td><span class="badge ${r.completed ? 'badge-done' : 'badge-open'}">${r.completed ? 'Done' : 'Open'}</span></td>
      <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${r.title}">${r.title || '—'}</td>
    </tr>
  `).join('');
}

// ─── Main ─────────────────────────────────────────────────────────────────────
const allProcessed = processData(RAW_DATA);

function applyFilters() {
  const filtered = filterData(allProcessed);
  renderStats(filtered);
  renderScatter(filtered);
  renderBarChart(filtered);
  renderTable(filtered);
}

// Initial render
applyFilters();
</script>
</body>
</html>
